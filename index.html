<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=https://zerotouch.com.co/">
    <link rel="canonical" href="https://zerotouch.com.co/">
    <title>Zero Touch | We've Moved</title>
    <link rel="icon" href="assets/web_fav.png" type="image/png">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0b1220;
            color: #e2e8f0;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #131c2e;
            border: 1px solid #22304a;
            border-radius: 14px;
            padding: 40px 28px;
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 600;
            margin: 0 0 24px;
            color: #f1f5f9;
        }
        .cta {
            display: inline-block;
            width: 100%;
            padding: 13px 20px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .countdown {
            margin-top: 18px;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="assets/web_fav.png" alt="Zero Touch" onerror="this.remove()">
        <h1>We've moved to a new site</h1>
        <a class="cta" href="https://zerotouch.com.co/">Visit New Site</a>
        <p class="countdown" id="countdown"></p>
    </div>
    <script>
        var s = 5;
        var el = document.getElementById('countdown');
        function tick() {
            el.textContent = 'Redirecting in ' + s + 's…';
            if (s <= 0) return;
            s -= 1;
            setTimeout(tick, 1000);
        }
        tick();
    </script>
</body>
</html>
