<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=https://zerotouch.com.co/">
    <link rel="canonical" href="https://zerotouch.com.co/">
    <title>Zero Touch | We've Moved</title>
    <link rel="icon" href="assets/web_fav.png" type="image/png">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #16213b;
            border: 1px solid #1f2c4d;
            border-radius: 16px;
            padding: 36px 28px;
            text-align: center;
        }
        .logo {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.3rem;
            margin: 0 0 12px;
            color: #10B981;
        }
        p {
            margin: 0 0 20px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .cta {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: #10B981;
            color: #05170f;
            font-weight: 700;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1rem;
        }
        .countdown {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="assets/web_fav.png" alt="Zero Touch" onerror="this.remove()">
        <h1>আমরা নতুন ঠিকানায় চলে গেছি</h1>
        <p>Zero Touch এখন আরও ভালো ও নতুন সাইটে চলে এসেছে। নিচের বাটনে ক্লিক করে নতুন সাইটে যান।</p>
        <a class="cta" href="https://zerotouch.com.co/">নতুন সাইটে যান</a>
        <p class="countdown" id="countdown"></p>
    </div>
    <script>
        var s = 5;
        var el = document.getElementById('countdown');
        function tick() {
            el.textContent = s + ' সেকেন্ডের মধ্যে নিয়ে যাওয়া হবে…';
            if (s <= 0) return;
            s -= 1;
            setTimeout(tick, 1000);
        }
        tick();
    </script>
</body>
</html>
